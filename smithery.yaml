# Smithery configuration for Enel RJ: Lista de Instalações
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_contas_enel_rj_instalacoes

name: contas_enel_rj_instalacoes-mcp
displayName: "Enel RJ: Lista de Instalações"
description: >
  Enel RJ: Lista de Instalações, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/contas_enel_rj_instalacoes-mcp
repository: https://github.com/mcp-dir/contas_enel_rj_instalacoes-mcp

tags:
  - contas_enel_rj_instalacoes
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_contas_enel_rj_instalacoes

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_contas_enel_rj_instalacoes/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
